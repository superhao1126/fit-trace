<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f5" />
    <script>
      if (window.Capacitor?.isNativePlatform?.()) {
        document.documentElement.classList.add('native-app', 'brand-launching');
      }
    </script>
    <link rel="stylesheet" href="/brand/splash.css" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>循形 · FitTrace</title>
  </head>
  <body>
    <div id="brand-splash" class="brand-splash" role="status" aria-label="循形正在启动">
      <div class="brand-splash__identity">
        <svg
          class="brand-splash__mark"
          viewBox="0 0 64 64"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M13 56V22C13 12 21 7 30 7H44M13 29H45"
            stroke="currentColor"
            stroke-width="10"
            stroke-linecap="round"
          />
          <circle cx="58" cy="7" r="5" fill="currentColor" />
        </svg>
        <h1 class="brand-splash__name">循形</h1>
        <p class="brand-splash__slogan">记录每一次改变</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

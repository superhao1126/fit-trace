<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="160" viewBox="0 0 1016 160"><rect x="0" y="0" width="1016" height="160" rx="16" fill="#EDF0F2"/><text x="24" y="38" font-family="PingFang SC" font-size="21" font-weight="600" fill="#202824">本月定位 · 切换动效</text><text x="24" y="76" font-family="PingFang SC" font-size="16" font-weight="600" fill="#26735B">2021年 → 本月 → 2026年</text><text x="24" y="111" font-family="PingFang SC" font-size="14" font-weight="400" fill="#727C77">年份标题与月份网格同步：220ms 淡入，向上移动 6px，使用现有标准缓动。</text><text x="24" y="138" font-family="PingFang SC" font-size="13" font-weight="400" fill="#727C77">数据立即切换，不延迟确认；减少动态时关闭动画。月份选中颜色沿用 140ms 过渡。</text></svg>
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>循形 · 完整设计点击原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8ece9;color:#222;font:14px system-ui,sans-serif}header{padding:16px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:white;position:sticky;top:0;z-index:2}header strong{margin-right:auto}button,select{font:inherit;border:1px solid #d6ded8;background:white;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}button.active{background:#24c867;color:#092b17}main{display:flex;justify-content:center;padding:28px 12px}#phone{width:390px;box-shadow:0 10px 50px #21332326;border-radius:24px;overflow:hidden;background:white;flex-shrink:0}#phone svg{display:block;width:100%;height:auto}svg [data-go]{cursor:pointer}svg [data-go]:focus{outline:2px solid #24c867}#phone.show .hot{fill:#24c867;fill-opacity:.12;stroke:#229d60;stroke-dasharray:5}footer{padding:0 24px 24px;text-align:center;color:#58675c;font-size:12px}dialog{border:0;border-radius:24px;padding:24px;max-width:calc(100% - 32px);width:320px;box-shadow:0 20px 60px #0004}#policy{max-height:85vh;overflow:auto;line-height:1.8}dialog::backdrop{background:#0007}input{width:100%;padding:14px;margin:16px 0;font:22px system-ui;border:1px solid #24c867;border-radius:12px}#status{min-height:24px;text-align:center;color:#229d60}body.dark{background:#0b110e;color:#edf5ef}body.dark header,body.dark button,body.dark select,body.dark dialog{background:#1d2620;color:#edf5ef;border-color:#35483d}body.dark button.active{background:#24c867;color:#092b17}a{color:#229d60}@media(max-width:460px){header{padding:12px;gap:6px}header strong{width:100%}main{padding:12px 0}#phone{max-width:100vw;border-radius:0}button,select{padding:9px}header select{max-width:160px}}
</style><header><strong>循形 · 完整设计原型</strong><select id="screen" aria-label="选择设计页面"></select><button id="back">返回</button><button id="light" class="active">浅色</button><button id="dark">深色</button><button id="wide" class="active">390px</button><button id="narrow">320px</button><button id="hotspots">显示点击区域</button></header><main><div id="phone" aria-label="设计画面"></div></main><div id="status" role="status"></div><footer>示例数据 · 可编辑 SVG 设计的点击演示，不连接真实账号或 API。<a href="catalog.json">全部页面清单</a></footer><dialog id="policy"><div id="policy-text"></div><button id="close-policy">关闭</button></dialog><dialog id="number"><form method="dialog"><strong>输入体重 · kg</strong><input id="weight" type="number" inputmode="decimal" value="70.2" min="0.1" step="0.1" required><button value="cancel">取消</button><button value="ok">确认输入</button></form></dialog>
<script>
let screens,aliases,current='home',width=innerWidth<390?320:390,dark=0,history=[],weight='70.2';const phone=document.querySelector('#phone'),selector=document.querySelector('#screen'),status=document.querySelector('#status');
const ns='http://www.w3.org/2000/svg';
function hit(root,x,y,w,h,to,label){let g=document.createElementNS(ns,'g');g.dataset.go=to;g.setAttribute('role','button');g.setAttribute('aria-label',label||to);g.setAttribute('tabindex','0');let r=document.createElementNS(ns,'rect');for(let[k,v]of Object.entries({x:x*width/390,y,width:w*width/390,height:h,fill:'transparent',class:'hot'}))r.setAttribute(k,v);g.append(r);root.append(g)}
function nav(root){['home','trends','archive','profile'].forEach((to,i)=>hit(root,i*97.5,772,97.5,72,to,['首页','趋势','档案','我的'][i]))}
function draw(){let id=aliases[current]||current;let key=`${id}:${width}:${dark}`;if(!screens[key])throw Error('缺少设计 '+key);phone.style.width=width+'px';phone.innerHTML=screens[key];document.body.classList.toggle('dark',!!dark);selector.value=id;let root=phone.querySelector('svg');if(['body','body-detail'].includes(id)){for(let t of root.querySelectorAll('text'))if(t.textContent==='70.2'||t.textContent==='70.2 kg')t.textContent=weight+(t.textContent.endsWith(' kg')?' kg':'')}
 if(['home','trends','archive','profile'].includes(current)||/^home-|^trends-|^profile-[123]$/.test(id))nav(root);
 if(id.startsWith('home-')){hit(root,24,433,342,50,'goal','设置目标');['body','meal','sports','photos'].forEach((to,i)=>hit(root,24+i*88,499,78,86,to,['记录体重','记录饮食','记录运动','记录照片'][i]));hit(root,285,50,81,55,'home-6','选择历史日期');hit(root,300,620,66,55,'archive','全部记录')}
 if(id==='login-1'||id==='login-3')hit(root,24,550,342,190,'home','演示登录进入首页');
 if(id==='profile-1'||id==='profile-2'){hit(root,24,110,342,90,'edit-profile','编辑资料');hit(root,24,211,342,108,'goal','我的目标');['body-history','meal-detail','sports','photos'].forEach((to,i)=>hit(root,24,374+i*54,342,54,to));hit(root,24,645,342,56,'edit-profile');hit(root,24,701,342,54,'settings')}
 if(id==='profile-6'){['edit-profile','password','profile-10','agreement','privacy','about'].forEach((to,i)=>hit(root,24,[159,211,315,419,471,523][i],342,53,to));hit(root,24,634,342,50,'profile-11')}
 if(id==='profile-4'){hit(root,24,281,342,62,'profile-17','修改昵称');hit(root,24,344,342,62,'profile-18','选择性别');hit(root,24,745,342,50,'profile','保存资料')}
 if(['profile-17','profile-18'].includes(id))hit(root,32,450,326,320,'edit-profile','确认资料草稿');
 if(id==='goal-1')hit(root,24,758,342,50,'goal-target','下一步');
 if(id==='goal-2'){hit(root,24,397,342,182,'goal-12','输入目标体重');hit(root,24,758,342,50,'profile','保存目标')}
 if(id==='goal-12')hit(root,282,651,84,109,'goal-target','确认目标体重输入');
 if(id.startsWith('strength-')){if(id==='strength-1'){hit(root,128,291,238,399,'strength-input','填写动作组数');hit(root,24,187,342,44,'strength-6','我的模板')}if(id==='strength-2')hit(root,282,654,84,109,'strength-3','加入清单');if(['strength-3','strength-4'].includes(id)){hit(root,0,741,210,100,'strength-list','展开已选清单');hit(root,222,758,144,50,'strength-7','完成训练');hit(root,80,442,280,140,'strength-5','修改单组')}if(id==='strength-5')hit(root,24,758,342,50,'strength-list');if(id==='strength-6')hit(root,130,204,236,335,'strength-3');if(id==='strength-7')hit(root,198,487,144,50,'workout-detail','确认保存')}
 if(id.startsWith('sports-')){if(id==='sports-2')hit(root,128,248,238,440,'sports-3','选择运动');if(id==='sports-3')hit(root,282,653,84,112,'sports-4','加入运动');if(id==='sports-4')hit(root,0,741,390,103,'sports-5','展开运动清单');if(id==='sports-5')hit(root,24,745,342,50,'sports-6','保存运动');if(['sports-1','sports-6'].includes(id))hit(root,24,745,342,50,'sports-2','新增运动');hit(root,90,668,220,68,'strength','力量逐组训练')}
 if(id==='trends-7'||id==='trends-8')hit(root,24,240,342,390,'body-detail','查看记录详情');
 // A common top-left back target is available on secondary screens.
 if(!['home','trends','archive','profile'].includes(current))hit(root,8,45,47,48,'back','返回上一页');
 ['light','dark'].forEach((k,i)=>document.querySelector('#'+k).classList.toggle('active',dark===i));document.querySelector('#wide').classList.toggle('active',width===390);document.querySelector('#narrow').classList.toggle('active',width===320);status.textContent='当前：'+current+' · '+(dark?'深色':'浅色')+' · '+width+'px';location.hash=encodeURIComponent(current);}
function go(to){if(to.startsWith('policy-full:')){fetch('policies.json').then(r=>r.json()).then(p=>{document.querySelector('#policy-text').innerHTML=p[to.split(':')[1]];document.querySelector('#policy').showModal()});return}if(to==='back'){current=history.pop()||'home'}else if(to.startsWith('key:')){status.textContent='数字输入为演示控件，点击“完成输入”返回';return}else if(to==='body-keyboard'){document.querySelector('#weight').value=weight;document.querySelector('#number').showModal();return}else if(to==='photo-date'||to==='photo-note'){status.textContent='日期和备注在当前设计中展示；保存前保留填写内容。';return}else{history.push(current);current=to}draw()}
phone.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});phone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){let g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}}});
document.querySelector('#close-policy').onclick=()=>document.querySelector('#policy').close();selector.onchange=()=>go(selector.value);document.querySelector('#back').onclick=()=>go('back');document.querySelector('#light').onclick=()=>{dark=0;draw()};document.querySelector('#dark').onclick=()=>{dark=1;draw()};document.querySelector('#wide').onclick=()=>{width=390;draw()};document.querySelector('#narrow').onclick=()=>{width=320;draw()};document.querySelector('#hotspots').onclick=()=>phone.classList.toggle('show');document.querySelector('#number').onclose=()=>{if(document.querySelector('#number').returnValue==='ok'){weight=document.querySelector('#weight').value;let svg=phone.querySelector('svg');for(let t of svg.querySelectorAll('text'))if(t.textContent==='70.2')t.textContent=weight;status.textContent='已更新表单体重为 '+weight+' kg，尚未提交'}};
Promise.all([fetch('screens.json').then(r=>r.json()),fetch('catalog.json').then(r=>r.json())]).then(([s,c])=>{screens=s;aliases=c.aliases;for(let key of c.screens){let id=key.split(':')[0],o=document.createElement('option');o.value=id;o.textContent=id;selector.append(o)}if(location.hash)current=decodeURIComponent(location.hash.slice(1));draw()}).catch(e=>{status.textContent=e.message});
</script></html>

server {
    listen 80;
    server_name fitness.rungos.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://fitness.rungos.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fitness.rungos.cn;
    ssl_certificate /etc/letsencrypt/live/fitness.rungos.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitness.rungos.cn/privkey.pem;

    root /opt/fittrace/current/apps/h5/dist;
    index index.html;
    client_max_body_size 8m;
    access_log /usr/local/nginx/logs/fittrace-access.log;
    error_log /usr/local/nginx/logs/fittrace-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /downloads/ {
        alias /var/lib/fittrace/downloads/;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.map$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }
}

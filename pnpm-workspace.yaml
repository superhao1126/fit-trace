packages:
  - 'apps/*'
  - 'packages/*'

# Node 版本不满足 root package.json 的 engines 时直接拒绝安装
engineStrict: true

allowBuilds:
  '@tdesign/uniapp': false
  core-js: false
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  vue-demi: true

# Keep the uni-app 20250821 compiler runtime on the upstream Vue 3.4-compatible router.
overrides:
  '@dcloudio/uni-h5>vue-router': 4.5.1

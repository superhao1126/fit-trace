name: Android
on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify modules, tests, lint and development APK
        run: ./gradlew verify --no-daemon
      - name: Verify production release
        run: ./gradlew :app:assembleProdRelease :app:lintProdRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
          retention-days: 14
